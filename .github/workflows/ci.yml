name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend for production
        run: npm run build

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      BROWSER_QA_OUTPUT: ${{ runner.temp }}/yumao-browser-e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated synthetic browser regression
        run: npm run test:e2e

      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: |
            ${{ runner.temp }}/yumao-browser-e2e/results.json
            ${{ runner.temp }}/yumao-browser-e2e/screenshots/
            ${{ runner.temp }}/yumao-browser-e2e/traces/
            ${{ runner.temp }}/yumao-browser-e2e/logs/
          retention-days: 7
